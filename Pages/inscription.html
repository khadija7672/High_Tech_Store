<body>
    <div>
        <header>

    <main>
        <form action="">
            <h2>Formulaire d'Inscription</h2> <hr>
            <div>
                <label for="">Nom :</label>
                <input type="text" required>
                <label for="">Prénom:</label>
                <input type="text" required>
                <label for="">Date de naissance:</label>
                <input type="date" required>
                
            </div>
            <div>
                <label for="">Sexe :</label>
                <input type="radio" name="s"> <label for="">Masculin</label>
                <input type="radio" name="s"> <label for="">Feminin</label>
                <label for="">Adresse:</label>
                <input type="text" name="" id="" required>
                <label for="">Code postal :</label>
                <input type="number" name="" id="" required>
            </div>
            <div>
                <label for="">Ville :</label>
                <input type="text" name="" id="" required>
                <label for="">Gouvernorat:</label>
                <select name="" id="">
                    <option value="">-- Choisir un Gouvernorat -</option>
                </select>
                <label for="">Fonction:</label>
                <input type="text" name="" id="" >
            </div>
            <div>
                <label for="">Adresse Email :</label> 
                <input type="email" placeholder="nom@exemple.com" id="" required>
                <label for="">Numéro de téléphone :</label>
                <input type="number" required>
            </div>
            <div>
                <label for="">Remarques :</label><br>
                <textarea name="" id="" placeholder="Vos remarques ou précisions..."></textarea>
            </div>
            <input type="submit" value="Valider l'inscription">
        </form>
    </main>
    <footer>
