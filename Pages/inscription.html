<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Style/style.css">
</head>
<body>
    <div class="header">
        <header>
            <h2 class="hts">HTS</h2>
            <h1>
                HighTechStore
            </h1>
        </header>
        <nav>
            <a href="index.html">Accuiel</a>
            <a href="pc.html">Pc</a>
            <a href="inscription.html" class="actif">Inscription</a>
            <a href="infos.html">Infos</a>
        </nav>
    </div>
    <main class="main">
        <form action="">
            <h2>Formulaire d'Inscription</h2> <hr>
            <div>
                <label for="">Nom :</label>
                <input class="input" type="text" required>
                <label for="">Prénom:</label>
                <input class="input" type="text" required>
                <label for="">Date de naissance:</label>
                <input class="input" type="date" required>
                
            </div>
            <div>
                <label for="">Sexe :</label>
                <input class="input" type="radio" name="s"> Masculin
                <input class="input" type="radio" name="s"> Feminin
                <label for="">Adresse:</label>
                <input class="input" type="text" name="" id="" required>
                <label for="">Code postal :</label>
                <input class="input" type="number" name="" id="" required>
            </div>
            <div>
                <label for="">Ville :</label>
                <input class="input" type="text" name="" id="" required>
                <label for="">Gouvernorat:</label>
                <select class="input" name="" id="">
                    <option value="">-- Choisir un Gouvernorat -</option>
                </select>
                <label for="">Fonction:</label>
                <input class="input" type="text" name="" id="" >
            </div>
            <div>
                <label for="">Adresse Email :</label> 
                <input class="input" type="email" placeholder="nom@exemple.com" id="" required>
                <label for="">Numéro de téléphone :</label>
                <input class="input" type="number" required>
            </div>
            <div>
                <label for="">Remarques :</label><br>
                <textarea class="input" name="" id="" placeholder="Vos remarques ou précisions..."></textarea>
            </div>
            <input class="input" type="submit" value="Valider l'inscription">
        </form>
    </main>
    <footer>
        <p>© 2026 HighTechStore - Tous droits réservés | Auteur : Votre nom et prénon
        </p>
    </footer>
</body>
</html>
